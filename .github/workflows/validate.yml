name: Validate package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check -r requirements-art.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Read immutable rulebook revision
        id: book
        run: node -e 'const fs=require("fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+JSON.parse(fs.readFileSync("content/source-lock.json")).commit+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: bruceamoser/heroes-of-legend
          ref: ${{ steps.book.outputs.commit }}
          path: .book-source
          sparse-checkout: |
            design/cards
            design/ancestries
      - name: Verify every ability and trait in rendered output
        run: node scripts/audit-rule-rendering.mjs
        env:
          HOL_BOOK_REPOSITORY: ${{ github.workspace }}/.book-source
      - run: npm run build:workshop
      - name: Read the Character Workshop rulebook revision
        id: forge-book
        run: node -e 'const fs=require("fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+JSON.parse(fs.readFileSync("content/forge-source-lock.json")).commit+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: bruceamoser/heroes-of-legend
          ref: ${{ steps.forge-book.outputs.commit }}
          path: .forge-book-source
          sparse-checkout: |
            design
      - run: npm run validate:forge
        env:
          HOL_BOOK_REPOSITORY: ${{ github.workspace }}/.forge-book-source
      - run: npm run test:workshop-forge
      - run: npm run test:workshop
      - run: npm run test:ancestry-workshop
      - run: npm run test:workshop-play
      - run: npm run test:workshop-resources
      - run: npm run test:workshop-recovery
      - run: npm run test:workshop-builder-view
      - run: npm run test:sheet-prototypes
      - run: npm run test:roll-preview
      - run: npm run test:chat-preview
      - run: npm run test:tools-preview
      - uses: actions/upload-artifact@v4
        with:
          name: character-workshop-screenshots
          path: |
            test-results/workshop/*.png
            test-results/sheets/*.png
            test-results/roll/*.png
            test-results/chat/*.png
            test-results/tools/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: heroes-of-legend-development
          path: dist/heroes-of-legend/
