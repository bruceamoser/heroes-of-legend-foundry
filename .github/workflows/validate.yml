name: Validate package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check -r requirements-art.txt
      - run: npm ci
      - run: npm run check
      - run: npm run build:workshop
      - run: npx playwright install --with-deps chromium
      - run: npm run test:workshop
      - run: npm run test:workshop-play
      - run: npm run test:workshop-resources
      - uses: actions/upload-artifact@v4
        with:
          name: character-workshop-screenshots
          path: test-results/workshop/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: heroes-of-legend-development
          path: dist/heroes-of-legend/
